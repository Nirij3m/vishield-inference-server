services:
  api:
    build:
      context: .
      dockerfile: conf/Dockerfile.api
    expose:
      - "8080"
    env_file:
      - ./conf/.env
    networks:
      - internal

  nginx:
    build:
      context: conf
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CERTBOT_EMAIL=ton@email.com
    volumes:
      - ./conf/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./conf/docker-entrypoint.sh:/docker-entrypoint.sh
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    depends_on:
      - api
    networks:
      - internal

volumes:
  certbot-www:
  certbot-certs:

networks:
  internal:
    driver: bridge